[project]
name = "excel-mcp"
version = "0.1.0"
description = "Safe Excel workbook operations exposed through MCP"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "pydantic>=2.7", "openpyxl>=3.1", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-openpyxl", "pandas-stubs"]

[project.scripts]
excel-mcp = "excel_mcp.server:main"

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.mypy]
strict = true
